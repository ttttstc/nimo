# nimo 默认能力组合（团队默认）
# 优先级：用户本次指定 > 项目 .nimo/project.yaml > 本文件 > 环境中发现的适用能力。
# 本文件是仓库中的唯一权威副本；安装脚本将其受控复制到已安装 nimo Skill 的
# references/defaults/capabilities.yaml，并记录来源版本。不要手工维护安装副本。
version: 0.1.0
capabilities:
  investigate:
    provider: host-native
    description: 调查理解：查明结构与行为事实
  specify:
    provider: host-native
    description: 规格：明确用户结果与验收行为
  design:
    provider: host-native
    description: 设计：方案与取舍说明
  implement:
    provider: host-native
    description: 实现：按规格与范围产出代码差异
  verify:
    provider: host-native
    description: 验证：对真实产物运行检查并留证据
  review:
    provider: host-native
    description: 审查：独立查找遗漏与风险
