<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>源码导览</title>
<style>
:root{color-scheme:light;--paper:#fff;--ink:#223047;--subtle:#617084;--line:#dce4ef;--lane:#f5f8fc;--blue:#245fc4;--current:#eaf2ff;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:#f6f8fb}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 11px}button:disabled{cursor:default;opacity:.4}button:hover:not(:disabled){border-color:#9fb7dc}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #94b8f5;outline-offset:2px}button[aria-pressed=true]{background:var(--current);border-color:var(--blue);color:var(--blue)}h1,h2,h3,p{margin:0}h1{font-size:20px;font-weight:600}h2{font-size:19px;font-weight:600}h3{font-size:16px;font-weight:600}.muted{color:var(--subtle)}.small{font-size:12px}.badge{display:inline-block;border-radius:5px;padding:2px 6px;background:#eef2f7;color:#536176;font-size:12px}.badge.confirmed{background:#eaf5f0;color:#32614e}.badge.inferred,.badge.needs-validation{background:#fff4db;color:#8c631c}.badge.unknown{background:#f0f1f4;color:#667084}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}.directory{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.directory-head{padding:20px 16px 13px;border-bottom:1px solid var(--line)}.directory-head h2{font-size:16px}.directory-toggle{display:none}.directory-body{padding:14px 12px;overflow:auto;min-height:0}.search{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:var(--lane);color:var(--ink)}.directory-count{margin:8px 3px 15px}.category{margin:0 0 19px}.category h3{font-size:12px;color:var(--subtle);padding:0 8px;margin:0 0 7px}.scene-link{display:block;text-align:left;width:100%;margin:3px 0;padding:9px 9px;border-color:transparent;background:transparent;border-radius:6px}.scene-link span{display:block}.scene-link .scene-meta{font-size:12px;margin-top:3px;color:var(--subtle)}.scene-link[aria-current=page]{color:var(--blue);background:var(--current);border-color:#d3e3ff}.workspace{min-width:0;overflow:auto}.topbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:18px 24px 12px;border-bottom:1px solid var(--line)}.headline{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.tabs{display:flex;gap:8px;margin-top:14px}.view{padding:22px 24px}.view-intro{margin-bottom:20px}.view-intro p{margin-top:7px;max-width:900px}.overview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.domain,.object-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}.domain:first-child{grid-column:1/-1}.domain p{margin:7px 0 12px}.node-tags{display:flex;gap:7px;flex-wrap:wrap}.node-tags span{border:1px solid var(--line);border-radius:5px;background:var(--lane);padding:4px 8px}.objects-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.object-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.object-card p{margin-top:9px}.object-card details{margin-top:12px}.object-relations{padding-left:18px;margin:9px 0}.object-relations li{margin:5px 0;overflow-wrap:anywhere}.source{padding:6px 0;overflow-wrap:anywhere;color:var(--subtle);font-size:12px}summary{cursor:pointer;color:var(--ink)}.footer{padding:12px 24px 18px;color:var(--subtle);font-size:12px;overflow-wrap:anywhere}
.scene-intro{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}.scene-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.scene-intro>p{margin-top:8px}.scene-facts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.scene-facts dt,.facts dt{color:var(--subtle);font-size:12px;margin-bottom:3px}.scene-facts dd,.facts dd{margin:0;overflow-wrap:anywhere}.scene-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}.canvas-panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}.canvas-tools{padding:11px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.position{font-weight:600;color:var(--blue);flex:1;white-space:nowrap}.step-controls,.zoom-controls{display:flex;gap:5px;align-items:center}.canvas-tools button{padding:5px 8px}.zoom-value{min-width:40px;text-align:center;color:var(--subtle);font-size:12px}.canvas-viewport{overflow:auto;height:clamp(440px,calc(100vh - 345px),780px);position:relative;overscroll-behavior:contain;cursor:grab}.canvas-viewport.panning{cursor:grabbing;user-select:none}.canvas-stage{position:relative}.canvas-content{position:absolute;left:0;top:0;padding:16px 14px 22px;transform-origin:top left;font-size:14px}.lanes{display:grid;gap:12px;text-align:center;color:var(--subtle);margin-bottom:16px}.plane{position:relative}.lane-backs{position:absolute;inset:0;display:grid;gap:12px;pointer-events:none}.lane-backs div{background:var(--lane);border-radius:8px}.rows{position:relative;display:grid;gap:36px;padding:8px}.row{display:grid;gap:12px;min-height:72px}.step{position:relative;z-index:1;display:flex;align-items:flex-start;gap:9px;text-align:left;width:100%;min-width:0;min-height:72px;padding:11px 10px;font-size:14px}.number{width:25px;height:25px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px}.step-text{min-width:0;flex:1}.step-title{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}.actor{display:block;font-size:14px;color:var(--subtle);margin-top:5px}.here{display:none;position:absolute;top:-13px;right:8px;border-radius:4px;background:var(--blue);color:white;padding:2px 6px;font-size:14px}.step[aria-current=step]{background:var(--current);border:2px solid var(--blue);padding:10px 9px;box-shadow:0 0 0 3px #245fc412}.step[aria-current=step] .number{background:var(--blue);color:#fff;border-color:var(--blue)}.step[aria-current=step] .here{display:block}.wires{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;overflow:visible}.wire{stroke:#8191a7;stroke-width:1.5;fill:none}.wire.current{stroke:var(--blue);stroke-width:2.5}.wire-label{font-size:14px;fill:var(--subtle)}.wire-label-bg{fill:var(--paper)}.canvas-note{padding:9px 12px;border-top:1px solid var(--line);color:var(--subtle);font-size:12px}.detail{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:17px;min-width:0;position:sticky;top:135px}.detail h3{margin:7px 0}.detail-position{color:var(--blue);font-size:12px;font-weight:600}.detail-description{margin:10px 0}.facts{display:grid;gap:14px;margin:16px 0}.participants{display:grid;gap:6px;margin-top:6px}.participant{padding:7px 9px;border:1px solid var(--line);border-radius:6px}.participant .badge{margin-left:6px}.neighbors{border-top:1px solid var(--line);padding-top:12px;margin:15px 0;font-size:12px}.neighbors p+p{margin-top:7px}.empty{padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:8px}.error{max-width:640px;margin:10vh auto;padding:24px}
@media(max-width:1240px){.scene-layout{grid-template-columns:minmax(0,1fr)}.detail{position:static;grid-row:1}.facts{grid-template-columns:1fr 1fr}.objects-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.canvas-viewport{height:620px}}
@media(max-width:760px){.shell{display:block;height:auto;min-height:100dvh;overflow:visible}.directory{border-right:0;border-bottom:1px solid var(--line)}.directory-head{padding:10px 15px;display:flex;align-items:center;justify-content:space-between}.directory-head p{display:none}.directory-toggle{display:block;padding:5px 10px}.directory-body{max-height:55vh}.directory-body.mobile-closed{display:none}.workspace{overflow:visible}.topbar{padding:15px}.headline{display:block}.headline>span{display:block;margin-top:3px}.view{padding:16px 15px}.overview-grid,.objects-grid{grid-template-columns:1fr}.domain:first-child{grid-column:auto}.scene-heading{align-items:flex-start;flex-wrap:wrap}.scene-facts{grid-template-columns:1fr;gap:10px}.canvas-viewport{height:570px}.facts{grid-template-columns:1fr}.footer{padding:12px 15px}.zoom-controls{margin-left:auto}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="shell" id="app">
 <aside class="directory" aria-label="场景目录">
  <div class="directory-head"><div><h2>场景目录</h2><p class="muted small">按真实使用路径展开</p></div><button class="directory-toggle" id="directory-toggle" aria-expanded="false">展开目录</button></div>
  <div class="directory-body mobile-closed" id="directory-body"><input class="search" id="search" type="search" placeholder="搜索场景标题或说明" aria-label="搜索场景"><p class="directory-count muted small" id="directory-count"></p><nav id="scene-directory" aria-label="分组场景"></nav></div>
 </aside>
 <main class="workspace">
  <header class="topbar"><div class="headline"><h1 id="model-title">源码导览</h1><span class="muted small">静态源码导览 · 阅读进度</span></div><nav class="tabs" aria-label="导览视图"><button data-view="overview" aria-pressed="true">系统概览</button><button data-view="objects" aria-pressed="false">核心对象</button><button data-view="scenes" aria-pressed="false">场景导览</button></nav></header>
  <section class="view" id="view-overview" aria-label="系统概览"></section>
  <section class="view" id="view-objects" aria-label="核心对象" hidden></section>
  <section class="view" id="view-scenes" aria-label="场景导览" hidden>
   <div class="scene-intro"><div class="scene-heading"><h2 id="scene-title"></h2><span id="scene-status" class="badge"></span></div><p class="muted" id="scene-description"></p><dl class="scene-facts"><div><dt>触发 / 前提</dt><dd id="scene-preconditions"></dd></div><div><dt>结束条件</dt><dd id="scene-completion"></dd></div></dl><p class="muted" id="scene-reason" hidden></p></div>
   <p class="empty" id="empty-scene" hidden></p>
   <div class="scene-layout"><section class="canvas-panel" aria-label="完整场景动作主线"><div class="canvas-tools"><span class="position" id="position" aria-live="polite"></span><div class="step-controls"><button id="prev" aria-label="上一步">上一步</button><button id="next" aria-label="下一步">下一步</button></div><div class="zoom-controls"><button id="zoom-out" aria-label="缩小画布">−</button><span id="zoom-value" class="zoom-value">100%</span><button id="zoom-in" aria-label="放大画布">+</button><button id="fit">Fit</button><button id="reset-view">恢复视图</button></div></div><div class="canvas-viewport" id="viewport" tabindex="0" aria-label="动作画布，可滚动和拖拽平移"><div class="canvas-stage" id="stage"><div class="canvas-content" id="canvas"><div class="lanes" id="lanes"></div><div class="plane" id="plane"><div class="lane-backs" id="lane-backs" aria-hidden="true"></div><svg class="wires" id="wires" aria-hidden="true"></svg><div class="rows" id="rows"></div></div></div></div></div><p class="canvas-note">蓝色表示当前讲解。左右方向键切换步骤；完整主线保留。Fit 最低保留 12px 字号，可继续滚动。</p></section>
   <aside class="detail" aria-label="当前动作讲解"><p class="detail-position" id="detail-position"></p><h3 id="detail-title"></h3><div id="detail-status"></div><p class="detail-description" id="detail-description"></p><dl class="facts"><div><dt>输入</dt><dd id="detail-input"></dd></div><div><dt>输出 / 交接</dt><dd id="detail-output"></dd></div></dl><p class="muted small">参与对象与源码实体</p><div class="participants" id="participants"></div><div class="neighbors"><p><span class="muted">上一步　</span><span id="before"></span></p><p><span class="muted">下一步　</span><span id="after"></span></p></div><details><summary id="source-summary">查看源码依据</summary><div id="sources"></div></details></aside></div>
  </section>
  <footer class="footer" id="snapshot"></footer>
 </main>
</div>
<main class="error" id="model-error" hidden><h1>模型尚未载入</h1><p class="muted">请用构建脚本注入完整场景模型后打开此页。</p></main>
<script id="model" type="application/json">/*__NIMO_MODEL__*/</script>
<script>
(() => {
 'use strict';
 const $ = (id) => document.getElementById(id);
 let model;
 try { model=JSON.parse($('model').textContent); if(!Array.isArray(model.journeys)||!Array.isArray(model.nodes))throw new Error(); }
 catch { $('app').hidden=true; $('model-error').hidden=false; return; }
 const nodes=new Map(model.nodes.map(n=>[n.id,n])), journeys=new Map(model.journeys.map(j=>[j.id,j]));
 const labels={confirmed:'源码已确认',inferred:'推断',unknown:'未知'};
 const statusLabels={confirmed:'源码链路已确认','needs-validation':'源码链路待核实','not-investigated':'尚未调查','out-of-scope':'范围外'};
 const element=(tag,className,text)=>{const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=String(text);return e;};
 const text=(value,fallback='模型未提供')=>Array.isArray(value)?value.length?value.join('；'):fallback:typeof value==='string'&&value.trim()?value:fallback;
 const badge=(certainty)=>element('span','badge '+(certainty||'unknown'),labels[certainty]||labels.unknown);
 const info=(journey,i)=>journey.steps[i]||{};
 let view='overview',sceneId=model.journeys[0]?.id,index=0,zoom=1,baseWidth=0,deepNodeId;
 $('model-title').textContent=model.title||'源码导览';document.title=(model.title||'源码导览')+' · 源码导览';
 $('snapshot').textContent=`源码摘要快照${model.snapshot?.head?' · HEAD '+model.snapshot.head.slice(0,10):''}${model.generatedAt?' · 生成于 '+model.generatedAt:''} · ${model.nodes.length} 个源码实体 / ${model.journeys.length} 个场景。状态表示源码调查覆盖；摘要匹配不证明语义正确或运行通过。`;
 function appendSources(container,items){
  container.replaceChildren();const seen=new Set();
  for(const n of items)for(const s of n?.sources||[]){const label=s.path+(s.line?':'+s.line:'')+(s.symbol?' · '+s.symbol:'');if(!seen.has(label)){seen.add(label);container.append(element('p','source',label));}}
  if(!seen.size)container.append(element('p','source','暂无源码依据，当前属于推断或未知。'));
  return seen.size;
 }
 function overview(){
  const target=$('view-overview'),intro=element('div','view-intro');intro.append(element('h2','','系统职责与边界'),element('p','muted',text(model.overview?.description,model.summary||'按职责域理解系统，再选择独立场景。')));target.append(intro);
  const grid=element('div','overview-grid'),sections=model.overview?.sections||model.groups.map(g=>({title:g.title,nodeIds:model.nodes.filter(n=>n.groupId===g.id).map(n=>n.id)}));
  if(!model.overview){const ungrouped=model.nodes.filter(n=>!n.groupId);if(ungrouped.length)sections.push({title:model.groups.length?'其他源码实体':'局部源码导览',nodeIds:ungrouped.map(n=>n.id)});}
  for(const section of sections){const card=element('section','domain'),items=(section.nodeIds||[]).map(id=>nodes.get(id)).filter(Boolean);card.append(element('h3','',section.title));if(section.description||items[0])card.append(element('p','muted',section.description||items[0].description));const tags=element('div','node-tags');for(const n of items){const link=element('button','',n.title);link.addEventListener('click',()=>openNode(n.id));tags.append(link);}card.append(tags);grid.append(card);}target.append(grid);
  target.append(element('p','muted small','职责域只呈现系统边界。具体动作、输入输出与代码依据在场景导览中逐步展开。'));target.lastChild.style.marginTop='18px';
 }
 function objects(){
  const target=$('view-objects');target.replaceChildren();const intro=element('div','view-intro');intro.append(element('h2','','核心对象与源码实体'),element('p','muted','对象表示系统中的记录、资源与关系。场景主线中的每一格表示动作；两者通过参与对象和源码依据关联。'));target.append(intro);
  const grid=element('div','objects-grid');let ids=model.objectNodeIds??model.nodes.filter(n=>n.kind==='data'||n.kind==='resource').map(n=>n.id);
  if(model.objectNodeIds===undefined&&!ids.length)ids=model.nodes.map(n=>n.id);
  if(deepNodeId&&!ids.includes(deepNodeId))ids=[...ids,deepNodeId];
  for(const id of ids){const n=nodes.get(id);if(!n)continue;const card=element('article','object-card'),heading=element('div','object-title');card.dataset.node=id;card.tabIndex=-1;heading.append(element('h3','',n.title),badge(n.certainty));card.append(heading,element('p','muted',n.description));
   const details=element('details'),summary=element('summary','','关联角色与源码');details.append(summary);const relations=model.edges.filter(e=>e.source===id||e.target===id),list=element('ul','object-relations');for(const edge of relations){const other=nodes.get(edge.source===id?edge.target:edge.source);if(other)list.append(element('li','',`${edge.label||'关联'} · ${other.title}（${labels[edge.certainty||'unknown']}）`));}if(list.children.length)details.append(list);const source=element('div');appendSources(source,[n]);details.append(source);card.append(details);grid.append(card);
  }target.append(grid);if(!ids.length)target.append(element('p','empty','模型未列出核心对象。可从系统概览查看源码实体。'));
 }
 function renderDirectory(){
  const query=$('search').value.trim().toLocaleLowerCase(),target=$('scene-directory');target.replaceChildren();let count=0;
  const seen=new Set(),categories=(model.categories||[]).map(c=>({...c,sceneIds:model.journeys.filter(j=>j.categoryId===c.id).map(j=>{seen.add(j.id);return j.id;})}));
  const rest=model.journeys.filter(j=>!seen.has(j.id));if(rest.length)categories.push({title:'其他场景',sceneIds:rest.map(j=>j.id)});
  for(const category of categories){const matching=category.sceneIds.map(id=>journeys.get(id)).filter(j=>(j.title+' '+j.description).toLocaleLowerCase().includes(query));if(!matching.length)continue;const group=element('section','category');group.append(element('h3','',category.title));
   for(const journey of matching){const button=element('button','scene-link');button.type='button';button.dataset.scene=journey.id;button.setAttribute('aria-current',view==='scenes'&&sceneId===journey.id?'page':'false');button.append(element('span','',journey.title),element('span','scene-meta',`${journey.steps.length} 个动作 · ${statusLabels[journey.status]||'调查状态未标注'}`));button.addEventListener('click',()=>{openScene(journey.id,0);writeHash(false);closeDirectory();});group.append(button);count++;}target.append(group);
  }$('directory-count').textContent=`${count} / ${model.journeys.length} 个场景`;if(!count)target.append(element('p','muted',model.journeys.length?'没有匹配的场景。':'当前为局部源码导览。请查看系统概览或源码实体。'));
 }
 function closeDirectory(){if(innerWidth<=760){$('directory-body').classList.add('mobile-closed');$('directory-toggle').setAttribute('aria-expanded','false');$('directory-toggle').textContent='展开目录';}}
 function setView(next){view=next;for(const name of ['overview','objects','scenes'])$('view-'+name).hidden=name!==view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));renderDirectory();}
 function writeHash(replace=true){const params=new URLSearchParams({view});if(view==='scenes'&&sceneId){params.set('scene',sceneId);if(journeys.get(sceneId)?.steps.length)params.set('step',String(index+1));}else if(view==='objects'&&deepNodeId)params.set('node',deepNodeId);const hash='#'+params.toString();if(location.hash!==hash)history[replace?'replaceState':'pushState'](null,'',hash);}
 function openNode(id,persist=true){if(!nodes.has(id))return;deepNodeId=id;objects();setView('objects');const card=[...$('view-objects').querySelectorAll('[data-node]')].find(e=>e.dataset.node===id);card?.scrollIntoView({block:'nearest'});card?.focus({preventScroll:true});closeDirectory();if(persist)writeHash(false);}
 function readHash(){const params=new URLSearchParams(location.hash.slice(1)),nodeId=params.get('node');const id=params.get('scene')||params.get('journey'),next=params.get('view'),step=Number(params.get('step'));if(nodeId&&nodes.has(nodeId))openNode(nodeId,false);else if(id&&journeys.has(id))openScene(id,Number.isFinite(step)?step-1:0);else if(next==='scenes'&&sceneId)openScene(sceneId,index);else setView(next==='objects'?'objects':'overview');}
 function renderSteps(){
  const journey=journeys.get(sceneId);if(!journey?.steps.length)return;const roles=[...new Set(journey.steps.map((_,i)=>info(journey,i).actor||'角色未标注'))],multi=baseWidth>=Math.max(600,roles.length*155);const columns=multi?roles.length:1;
  $('lanes').replaceChildren();$('lane-backs').replaceChildren();$('lanes').style.display=multi?'grid':'none';$('lanes').style.gridTemplateColumns=$('lane-backs').style.gridTemplateColumns=`repeat(${columns},minmax(0,1fr))`;
  for(const role of multi?roles:['']){$('lanes').append(element('span','',role));$('lane-backs').append(element('div'));}
  $('rows').replaceChildren();journey.steps.forEach((step,i)=>{const row=element('div','row');row.style.gridTemplateColumns=`repeat(${columns},minmax(0,1fr))`;const role=info(journey,i).actor||'角色未标注',button=element('button','step');button.type='button';button.dataset.step=String(i+1);button.style.gridColumn=String(multi?roles.indexOf(role)+1:1);button.setAttribute('aria-label',`第 ${i+1} 步：${step.title}`);button.setAttribute('aria-current',i===index?'step':'false');const content=element('span','step-text');content.append(element('span','step-title',step.title),element('span','actor',role));button.append(element('span','number',i+1),content,element('span','here','当前位置'));button.addEventListener('click',()=>selectStep(i));row.append(button);$('rows').append(row);});
  measure();
 }
 function openScene(id,step=0){
  sceneId=id;const journey=journeys.get(id);if(!journey)return;index=Math.max(0,Math.min(journey.steps.length-1,Math.trunc(step)));setView('scenes');$('scene-title').textContent=journey.title;$('scene-description').textContent=journey.description;$('scene-preconditions').textContent=text(journey.preconditions,'前提未标注');$('scene-completion').textContent=text(journey.completion,'结束条件未标注');$('scene-status').className='badge '+(journey.status||'unknown');$('scene-status').textContent=statusLabels[journey.status]||'调查状态未标注';$('scene-reason').hidden=!journey.reason;$('scene-reason').textContent=journey.reason||'';
  const empty=!journey.steps.length;$('empty-scene').hidden=!empty;$('empty-scene').textContent=journey.reason||'当前场景尚未调查。';document.querySelector('.scene-layout').hidden=empty;for(const id of ['prev','next','zoom-out','zoom-in','fit','reset-view'])$(id).disabled=empty;
  zoom=1;baseWidth=Math.max(280,$('viewport').clientWidth);$('viewport').scrollTop=0;$('viewport').scrollLeft=0;if(!empty){renderSteps();selectStep(index,false);}
 }
 function selectStep(next,persist=true,reveal=false){
  const journey=journeys.get(sceneId);if(!journey?.steps.length)return;index=Math.max(0,Math.min(journey.steps.length-1,next));const step=journey.steps[index],metadata=info(journey,index),items=(step.nodeIds||[]).map(id=>nodes.get(id)).filter(Boolean);document.querySelectorAll('.step').forEach((b,i)=>b.setAttribute('aria-current',i===index?'step':'false'));
  $('position').textContent=`当前位置 ${index+1} / ${journey.steps.length}`;$('detail-position').textContent=`当前讲解 · 第 ${index+1} 步 · ${metadata.actor||'角色未标注'}`;$('detail-title').textContent=step.title;$('detail-description').textContent=step.description;$('detail-input').textContent=text(metadata.input,'输入未标注');$('detail-output').textContent=text(metadata.output,'输出未标注');
  const certainty=items.length&&items.every(n=>n.certainty==='confirmed')?'confirmed':items.some(n=>n.certainty==='unknown')||!items.length?'unknown':'inferred';$('detail-status').replaceChildren(element('span','muted small','参与实体依据　'),badge(certainty));$('participants').replaceChildren();for(const n of items){const p=element('div','participant');p.append(element('span','',n.title),badge(n.certainty));$('participants').append(p);}if(!items.length)$('participants').append(element('p','muted','参与对象未标注'));
  const count=appendSources($('sources'),items);$('source-summary').textContent=`查看源码依据${count?'（'+count+'）':''}`;$('before').textContent=journey.steps[index-1]?.title||'场景起点';$('after').textContent=journey.steps[index+1]?.title||'场景终点';$('prev').disabled=index===0;$('next').disabled=index===journey.steps.length-1;
  requestAnimationFrame(()=>{drawWires();if(reveal){const b=$('rows').querySelector(`[data-step="${index+1}"]`),r=b?.getBoundingClientRect(),v=$('viewport').getBoundingClientRect();if(r&&r.top<v.top+35)$('viewport').scrollTop-=v.top+60-r.top;else if(r&&r.bottom>v.bottom-35)$('viewport').scrollTop+=r.bottom-v.bottom+60;}});if(persist)writeHash();
 }
 const svgNS='http://www.w3.org/2000/svg';
 function svg(tag,attributes,content){const e=document.createElementNS(svgNS,tag);for(const [key,value]of Object.entries(attributes))e.setAttribute(key,String(value));if(content!==undefined)e.textContent=content;return e;}
 function drawWires(){
  if(view!=='scenes'||!journeys.get(sceneId)?.steps.length)return;const plane=$('plane'),surface=$('wires'),r=plane.getBoundingClientRect(),width=plane.clientWidth,height=plane.clientHeight;surface.replaceChildren();surface.setAttribute('viewBox',`0 0 ${width} ${height}`);const defs=svg('defs',{});
  for(const [id,color]of [['arrow-neutral','#8191a7'],['arrow-current','#245fc4']]){const marker=svg('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});marker.append(svg('path',{d:'M0 0 L10 5 L0 10 z',fill:color}));defs.append(marker);}surface.append(defs);
  const steps=[...$('rows').querySelectorAll('.step')],journey=journeys.get(sceneId);steps.slice(0,-1).forEach((button,i)=>{const a=button.getBoundingClientRect(),b=steps[i+1].getBoundingClientRect(),x1=(a.left+a.width/2-r.left)/zoom,x2=(b.left+b.width/2-r.left)/zoom,y1=(a.bottom-r.top)/zoom+2,y2=(b.top-r.top)/zoom-5,mid=(y1+y2)/2,current=i+1===index;
   surface.append(svg('path',{d:`M${x1} ${y1} V${mid} H${x2} V${y2}`,class:'wire'+(current?' current':''),'marker-end':`url(#${current?'arrow-current':'arrow-neutral'})`}));
   const edges=(journey.steps[i].edgeIds||[]).map(id=>model.edges.find(e=>e.id===id)).filter(e=>e?.label),raw=edges[0]?.label||`交接第 ${i+2} 步`,same=Math.abs(x1-x2)<1,right=x1>width/2,limit=same?Math.max(5,Math.min(18,Math.floor((Math.max(x1,width-x1)-25)/14))):18,label=raw.length>limit?raw.slice(0,limit-1)+'…':raw;
   const t=svg('text',{x:same?x1+(right?-11:11):(x1+x2)/2,y:mid+4,'text-anchor':same?(right?'end':'start'):'middle',class:'wire-label'},label);surface.append(t);const box=t.getBBox();surface.insertBefore(svg('rect',{x:box.x-3,y:box.y-2,width:box.width+6,height:box.height+4,rx:3,class:'wire-label-bg'}),t);
  });
 }
 function measure(){
  if(view!=='scenes'||!journeys.get(sceneId)?.steps.length)return;$('canvas').style.width=baseWidth+'px';$('canvas').style.transform=`scale(${zoom})`;$('stage').style.width=Math.max($('viewport').clientWidth,baseWidth*zoom)+'px';$('stage').style.height=$('canvas').scrollHeight*zoom+'px';$('zoom-value').textContent=Math.round(zoom*100)+'%';$('zoom-out').disabled=zoom<=6/7+.001;$('zoom-in').disabled=zoom>=1.8;requestAnimationFrame(drawWires);
 }
 function changeZoom(next){
  const old=zoom,v=$('viewport'),cx=(v.scrollLeft+v.clientWidth/2)/old,cy=(v.scrollTop+v.clientHeight/2)/old;zoom=Math.max(6/7,Math.min(1.8,next));measure();v.scrollLeft=Math.max(0,cx*zoom-v.clientWidth/2);v.scrollTop=Math.max(0,cy*zoom-v.clientHeight/2);
 }
 overview();objects();renderDirectory();document.querySelector('[data-view="scenes"]').disabled=!model.journeys.length;
 document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.view==='scenes'&&sceneId){if(view!=='scenes')openScene(sceneId,index);}else setView(button.dataset.view);writeHash(false);}));
 $('search').addEventListener('input',renderDirectory);$('directory-toggle').addEventListener('click',()=>{const open=$('directory-body').classList.toggle('mobile-closed')===false;$('directory-toggle').setAttribute('aria-expanded',String(open));$('directory-toggle').textContent=open?'收起目录':'展开目录';});
 $('prev').addEventListener('click',()=>selectStep(index-1,true,true));$('next').addEventListener('click',()=>selectStep(index+1,true,true));$('zoom-out').addEventListener('click',()=>changeZoom(zoom-.1));$('zoom-in').addEventListener('click',()=>changeZoom(zoom+.1));
 $('fit').addEventListener('click',()=>{const v=$('viewport');changeZoom(Math.min(v.clientWidth/baseWidth,v.clientHeight/$('canvas').scrollHeight));v.scrollLeft=0;v.scrollTop=0;});$('reset-view').addEventListener('click',()=>{changeZoom(1);$('viewport').scrollTop=0;$('viewport').scrollLeft=0;});
 document.addEventListener('keydown',event=>{if(view!=='scenes'||event.ctrlKey||event.metaKey||event.altKey||event.target.closest('input,textarea,select,[contenteditable=true]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();selectStep(index+(event.key==='ArrowRight'?1:-1),true,true);}const control={'+':'zoom-in','=':'zoom-in','-':'zoom-out',f:'fit'}[event.key];if(control){event.preventDefault();$(control).click();}if(event.key==='Escape'){setView('overview');writeHash(false);}});
 let pan=null;const viewport=$('viewport');viewport.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'||event.button!==0||event.target.closest('button,summary,a,input'))return;pan={x:event.clientX,y:event.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.classList.add('panning');viewport.setPointerCapture(event.pointerId);event.preventDefault();});viewport.addEventListener('pointermove',event=>{if(pan){viewport.scrollLeft=pan.left+pan.x-event.clientX;viewport.scrollTop=pan.top+pan.y-event.clientY;}});const stopPan=()=>{pan=null;viewport.classList.remove('panning');};viewport.addEventListener('pointerup',stopPan);viewport.addEventListener('pointercancel',stopPan);
 let resizeFrame;new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if(view==='scenes'){const width=Math.max(280,viewport.clientWidth);if(Math.abs(width-baseWidth)>1){baseWidth=width;renderSteps();}else measure();}});}).observe(viewport);
 window.addEventListener('hashchange',readHash);window.addEventListener('popstate',readHash);readHash();
})();
